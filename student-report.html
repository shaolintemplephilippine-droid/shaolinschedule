<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>菲律宾少林文化中心｜学员课时报告 | Student Report</title>
  <style>
    :root{--ink:#202124;--muted:#697077;--line:#e6e7e8;--brand:#9b241c;--cream:#fffaf2;--ok:#147a4a;--warn:#a25b00}
    *{box-sizing:border-box}body{margin:0;background:#f5f3ef;color:var(--ink);font-family:"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
    .shell{max-width:820px;margin:0 auto;padding:24px 16px 48px}
    .hero{padding:20px 4px 24px;text-align:center}
    .seal{display:inline-block;width:72px;height:72px}
    .seal img{width:100%;height:100%;object-fit:contain}
    .hero h1{font-size:25px;margin:10px 0 6px}
    .hero p{margin:0;color:var(--muted);font-size:14px}
    .privacy{background:#fef3c7;border:1px solid #fcd34d;border-radius:10px;padding:10px 14px;font-size:13px;color:#92400e;text-align:center;margin-bottom:16px}
    .card{overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 7px 22px #2b210b0a}
    .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 20px 16px;background:var(--cream);border-bottom:1px solid #f0e7d9}
    .student-name{font-size:24px;font-weight:800}
    .meta{margin-top:4px;color:var(--muted);font-size:13px}
    .stamp{text-align:right;color:var(--muted);font-size:12px;white-space:nowrap}
    .stamp b{display:block;color:var(--brand);font-size:15px}
    .summary{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
    .stat{padding:18px 11px;text-align:center;border-right:1px solid var(--line)}
    .stat:last-child{border:0}
    .stat b{display:block;font-size:27px;color:var(--brand);line-height:1.1}
    .stat small{display:block;margin-top:5px;color:var(--muted)}
    .details{padding:18px 20px}
    .details h2{font-size:16px;margin:0 0 10px}
    .info{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
    .info div{padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px}
    .info div:nth-last-child(-n+2){border-bottom:0}
    .info span{display:block;color:var(--muted);font-size:12px;margin-bottom:3px}
    .good{color:var(--ok);font-weight:700}
    .caution{color:var(--warn);font-weight:700}
    .att-title{margin:23px 0 10px;font-size:16px;font-weight:700}
    .records{border:1px solid var(--line);border-radius:10px;overflow:hidden}
    .record{display:grid;grid-template-columns:98px 1fr auto;gap:10px;padding:12px;border-bottom:1px solid var(--line);font-size:14px}
    .record:last-child{border:0}
    .record time{color:var(--muted)}
    .record em{font-style:normal;color:var(--ok);font-size:12px;font-weight:700}
    .empty{padding:24px;text-align:center;color:var(--muted);font-size:14px}
    .actions{display:flex;gap:9px;padding:0 20px 20px}
    .actions button{border:0;border-radius:9px;padding:12px 17px;background:var(--brand);color:white;font:inherit;font-weight:700;cursor:pointer}
    .actions button.secondary{color:var(--brand);background:#fff;border:1px solid var(--brand)}
    .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:15px}
    .error-box{text-align:center;padding:60px 20px;color:var(--muted)}
    .error-box .icon{font-size:48px;margin-bottom:16px}
    .error-box h2{font-size:18px;color:var(--ink);margin-bottom:8px}
    .error-box p{font-size:14px;max-width:400px;margin:0 auto}
    .en{display:block;color:var(--muted);font-size:.82em;font-weight:400;margin-top:2px;font-style:normal}
    .stat .en{font-size:.72em;margin-top:3px}
    .info .en{font-size:.85em;margin-top:1px}
    .hidden{display:none}
    @media(max-width:520px){.shell{padding:12px 10px 30px}.hero{padding:15px 0}.hero h1{font-size:21px}.summary .stat{padding:14px 5px}.stat b{font-size:23px}.details{padding:16px 13px}.card-head{padding:16px 14px}.info{grid-template-columns:1fr}.info div:nth-last-child(2){border-bottom:1px solid var(--line)}.record{grid-template-columns:86px 1fr auto}.actions{padding:0 13px 16px}}
    @media print{body{background:#fff}.shell{max-width:none;padding:0}.hero,.actions,.foot,.privacy{display:none}.card{border:0;box-shadow:none;border-radius:0}.hidden{display:none!important}}
  </style>
</head>
<body>
<main class="shell">
  <header class="hero"><div class="seal"><img src="logo.png" alt="Philippine Shaolin Cultural Center"></div><h1 id="iTitle"></h1></header>
  <div class="privacy">🔒 <span id="iPrivacy"></span></div>

  <div id="loading" style="text-align:center;padding:60px;color:var(--muted)"><span id="iLoading"></span></div>

  <div id="error" class="error-box hidden">
    <div class="icon" id="errorIcon">🔗</div>
    <h2 id="errorTitle"></h2>
    <p id="errorDesc"></p>
  </div>

  <section id="report" class="card hidden" aria-live="polite">
    <div class="card-head">
      <div><div id="rName" class="student-name"></div><div id="rClass" class="meta"></div></div>
      <div class="stamp"><b id="iStampTitle"></b><span id="rDate"></span></div>
    </div>
    <div class="summary">
      <div class="stat"><b id="rTotal"></b><small id="iLblTotal"></small></div>
      <div class="stat"><b id="rUsed"></b><small id="iLblUsed"></small></div>
      <div class="stat"><b id="rRemain"></b><small id="iLblRemain"></small></div>
    </div>
    <div class="details">
      <h2 id="iDetailsTitle"></h2>
      <div class="info">
        <div><span id="iLblStart"></span><b id="rStart"></b></div>
        <div><span id="iLblEnd"></span><b id="rEnd"></b></div>
        <div><span id="iLblValidDays"></span><b id="rValidDays"></b></div>
        <div><span id="iLblDaysLeft"></span><b id="rDaysLeft"></b></div>
      </div>
      <div class="att-title" id="rMonthTitle"></div>
      <div id="rRecords" class="records"></div>
    </div>
    <div class="actions">
      <button id="iBtnPrint" onclick="window.print()"></button>
      <button id="iBtnShare" class="secondary" onclick="shareReport()"></button>
    </div>
  </section>

  <p class="foot" id="iFoot"></p>
</main>

<script>
var EDGE_FN_URL = 'https://wftnszpquwlqmgcevkyj.supabase.co/functions/v1/student-report';
var reportData = null;

function bi(cn, en) { return cn + '<span class="en">' + en + '</span>'; }
function setBi(id, cn, en) { var e = document.getElementById(id); if (e) e.innerHTML = bi(cn, en); }

function applyLang() {
  document.title = '菲律宾少林文化中心 | Philippine Shaolin Cultural Center';
  setBi('iTitle', '菲律宾少林文化中心 · 学员课时报告', 'Philippine Shaolin Cultural Center · Student Report');
  setBi('iPrivacy', '此链接仅供本人查看，请勿转发给他人。', 'This link is for personal use only. Do not share with others.');
  setBi('iLoading', '正在加载报告…', 'Loading report…');
  setBi('iStampTitle', '课时明细', 'Class Details');
  setBi('iLblTotal', '总课时', 'Total Hours');
  setBi('iLblUsed', '已消课时', 'Used Hours');
  setBi('iLblRemain', '剩余课时', 'Remaining');
  setBi('iDetailsTitle', '课时详情', 'Enrollment Details');
  setBi('iLblStart', '生效日期', 'Start Date');
  setBi('iLblEnd', '到期日期', 'End Date');
  setBi('iLblValidDays', '有效期天数', 'Valid Days');
  setBi('iLblDaysLeft', '剩余天数', 'Days Left');
  setBi('iBtnPrint', '打印／保存为图片', 'Print / Save as Image');
  setBi('iBtnShare', '分享明细', 'Share Details');
  setBi('iFoot', '课时以中心考勤记录为准。如有疑问，请联系您的教练。', 'Attendance is based on the center\'s official records. Contact your instructor for questions.');
}
applyLang();

var ERR = {
  invalid:     { icon:'🔗', cn:'查询链接无效', en:'Invalid Link', cnD:'无法识别此查询链接，请联系管理员获取新的专属链接。', enD:'This link cannot be recognized. Please contact the admin for a new link.' },
  revoked:     { icon:'🚫', cn:'查询链接已失效', en:'Link Deactivated', cnD:'此链接已被管理员停用，请联系管理员获取新链接。', enD:'This link has been deactivated. Please contact the admin for a new link.' },
  expired:     { icon:'⏰', cn:'查询链接已过期', en:'Link Expired', cnD:'此链接已超过有效期，请联系管理员获取新链接。', enD:'This link has expired. Please contact the admin for a new link.' },
  not_found:   { icon:'📋', cn:'无法找到对应学员', en:'Student Not Found', cnD:'系统中未找到该链接对应的学员信息，请联系管理员。', enD:'No student record found. Please contact the admin.' },
  rate_limited:{ icon:'⏳', cn:'访问过于频繁', en:'Too Many Requests', cnD:'请稍后再试。', enD:'Please try again later.' },
  network:     { icon:'⚠️', cn:'系统暂时无法读取学员信息', en:'Unable to Load', cnD:'请检查网络连接后刷新页面重试。', enD:'Please check your connection and refresh the page.' }
};

function fmtDate(s) {
  if (!s) return '-';
  return new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric'}).format(new Date(s+'T12:00:00'));
}
function fmtMonth(m) {
  var p = m.split('-');
  var en = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return p[0] + '年' + (+p[1]) + '月 / ' + en[+p[1]] + ' ' + p[0];
}

async function loadReport() {
  var hash = location.hash;
  var match = hash.match(/[?&]?t=([^&]+)/);
  if (!match || !match[1]) { showError('invalid'); return; }
  var token = match[1];
  try {
    var res = await fetch(EDGE_FN_URL, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer sb_publishable_RJbXFWVO0UAsslybWKj1Ig_uRyi3dj1' },
      body: JSON.stringify({ token: token })
    });
    if (!res.ok) {
      var code = 'invalid';
      try { var d = await res.json(); code = d.errorCode || 'invalid'; } catch(e) {}
      showError(code); return;
    }
    renderReport(await res.json());
  } catch(e) { console.error(e); showError('network'); }
}

function showError(code) {
  var m = ERR[code] || ERR.invalid;
  document.getElementById('errorIcon').textContent = m.icon;
  setBi('errorTitle', m.cn, m.en);
  setBi('errorDesc', m.cnD, m.enD);
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('error').classList.remove('hidden');
}

function renderReport(d) {
  reportData = d;
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('report').classList.remove('hidden');
  var now = new Date();
  document.getElementById('rName').textContent = d.name;
  document.getElementById('rClass').textContent = d.className + (d.isDisciple ? ' · 弟子班 / Disciple' : '');
  document.getElementById('rDate').innerHTML = bi('更新于 ' + fmtDate(now.toISOString().slice(0,10)), 'Updated ' + fmtDate(now.toISOString().slice(0,10)));
  document.getElementById('rTotal').textContent = d.isDisciple ? '不限' : d.totalHours;
  document.getElementById('rUsed').textContent = d.usedHours;
  document.getElementById('rRemain').textContent = d.isDisciple ? '∞' : d.remainingHours;
  document.getElementById('rStart').textContent = fmtDate(d.startDate);
  document.getElementById('rEnd').textContent = fmtDate(d.endDate);
  document.getElementById('rValidDays').textContent = d.validDays ? d.validDays + ' 天 / days' : '-';
  if (d.daysLeft !== null) {
    var el = document.getElementById('rDaysLeft');
    if (d.daysLeft < 0) { el.textContent = '已超期 ' + Math.abs(d.daysLeft) + ' 天 / Overdue ' + Math.abs(d.daysLeft) + ' days'; el.className = 'caution'; }
    else { el.textContent = d.daysLeft + ' 天 / days'; el.className = d.daysLeft <= 14 ? 'caution' : 'good'; }
  } else { document.getElementById('rDaysLeft').textContent = '-'; }
  var records = d.monthlyAttendance || [];
  document.getElementById('rMonthTitle').innerHTML = bi(fmtMonth(d.currentMonth||'') + '考勤（' + records.length + ' 次）', fmtMonth(d.currentMonth||'') + ' Attendance (' + records.length + ' sessions)');
  if (records.length === 0) {
    document.getElementById('rRecords').innerHTML = '<div class="empty">' + bi('本月暂无考勤记录','No attendance records this month') + '</div>';
    return;
  }
  var html = '';
  records.forEach(function(r) {
    html += '<div class="record"><time>' + fmtDate(r.date) + '</time><span>' + r.time + (r.teacher ? '<br><small style="color:var(--muted)">' + r.teacher + '</small>' : '') + '</span><em>' + bi('出勤 · 1 课时','Present · 1 hour') + '</em></div>';
  });
  document.getElementById('rRecords').innerHTML = html;
}

function shareReport() {
  if (!reportData) return;
  var d = reportData;
  var text = '[菲律宾少林文化中心 Philippine Shaolin Cultural Center]\n'
    + '学员 Student: ' + d.name + '\n'
    + '班级 Class: ' + d.className + '\n'
    + '总课时 Total: ' + (d.isDisciple ? '不限 Unlimited' : d.totalHours) + '\n'
    + '已消课时 Used: ' + d.usedHours + '\n'
    + '剩余课时 Remaining: ' + (d.isDisciple ? '不限 Unlimited' : d.remainingHours) + '\n'
    + '生效日期 Start: ' + (d.startDate || '-') + '\n'
    + '到期日期 End: ' + (d.endDate || '-') + '\n'
    + '剩余天数 Days Left: ' + (d.daysLeft !== null ? d.daysLeft + ' days' : '-');
  if (navigator.share) { navigator.share({title:'学员课时报告 / Student Report',text:text}).catch(function(){}); }
  else { navigator.clipboard.writeText(text).then(function(){alert('已复制 / Copied to clipboard');}).catch(function(){prompt('请复制 / Please copy:',text)}); }
}

loadReport();
</script>
</body>
</html>
